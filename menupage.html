 <style>
        #wrapper-bg-view {

            padding: 0;
            height: 100vh; 
            background-color: white;

        overflow-y:hidden;
        }

        .animation-container {
            position: relative;
            top: 450px;

            width: 100%;

            height: 100vh;
            max-height: 900px;
            background-color: transparent;
            z-index: 0; /* Higher z-index allows it to scroll over the sticky navbar */
        }

        .shape {
            position: absolute;
            transition: transform 0.1s ease-out;
            will-change: transform;
            max-height: 90% ;
            transform-origin: left center; 
        }

        #text-layer {
            margin-top: 40%;
        }

        #shape-yellow {
            min-width: 3cm;

        }

            header h1 {

            }
            header nav {
                font-size: 0.875rem !important;
                line-height: 1.25rem !important;
            }

            #text-layer {
                margin-top: 0% !important;
                font-size: 1.5rem !important;
                line-height: 2.2rem !important;
                max-width: 80% !important;
                width: 80% !important;
                padding: 0;
                text-align: center;
                display: block !important;
            }

            .animation-container {

                top: -70px !important;
                height: 80vh !important;
            }

            #shape-yellow {
                position: absolute !important;
                top: 5% !important;
                left: 5% !important;
                width: 75% !important;
                height: auto !important;
                z-index: 5 !important;
            }

            #shape-teal {
                top: 18% !important;
                left: -5% !important;
                width: 60% !important;
                height: auto !important;
                z-index: 10 !important;
            }

            #shape-blue {
                left: 40% !important;
                top: 22% !important;
                width: 58% !important;
                height: auto !important;
                z-index: 10 !important;
            }

            #shape-red {
                left: 15% !important;
                top: 48% !important;
                width: 75% !important;
                height: auto !important;
                z-index: 20 !important; 
            }

            #pink {
                left: auto !important;
                right: 15% !important;
                top: 8% !important;
                width: 20% !important;
                height: auto !important;
                z-index: 4 !important;
            }

            #secgreen {
                margin-top: 0% !important;
                top: 32% !important;
                left: 75% !important;
                width: 30% !important;
                height: auto !important;
                z-index: 6 !important;
            }
        }

        /* --- 2. iPad / Tablet Specific Layout (768px to 1024px) --- */
        @media (min-width: 768px) and (max-width: 1024px) {
             #wrapper-bg-view {
                height:110vh;
            }

            .animation-container{
    width:100vw !important;
    left:50%;
    top: 400px;
    transform:translate(-50%,-55%);
}

            #shape-yellow {
                position: absolute !important;
                top: 5% !important;
                 left: 8% !important;
    width: 65% !important;
                height: auto !important;
            }

            #shape-teal {
                top: 18% !important;
                  left: -5% !important;
    width: 55% !important;
                height: auto !important;
            }

            #shape-blue {
            
                top: 22% !important;
                 left: 40% !important;
    width: 55% !important;
            }

            #shape-red {
                 left: 10% !important;
    width: 72% !important;
                top: 52% !important;
               
                height: auto !important;
            }

            #pink {
                left: 60% !important;
                right: auto !important;
                top: 8% !important;
                width: 15% !important;
                height: auto !important;
            }

            #secgreen {
                top: 35% !important;
                  left: auto !important;

                height: auto !important;
            }

            #text-layer {
                display: none !important;
            }
        }
        /* --- 3. Large Laptop Styles (1025px to 1668px) --- */
        @media (min-width: 1025px) and (max-width: 1668px) {
            .animation-container{
                top: 77% !important;
            }
            #shape-blue {
                left: 43% !important;
                top: 21% !important;
                width: 55% !important;
                height: 20%;
            }
            #pink {
                margin-left: 29% !important;
                top: 10% !important;
                width: 60%;
                height: 95%;
            }
        }
    </style>
</head>
<body>

</div>

</div>

         <a href="main.html#about-us" >About</a>

<div class="relative w-full h-screen">
        <!-- Kept the main intro text above the sliding layers -->
        <div class="absolute z-[999] h-screen inset-0 flex justify-center items-center font-semibold text-white pointer-events-none">
            <h1 id="text-layer" class="text-center text-4xl max-w-auto md:w-[30%] leading-10 pointer-events-auto">
                We help you set focus and gain impact. By adding to the conversation, not to the noise. 
            </h1>
        </div>

        <div class="animation-container">
            <div id="pink" class="shape absolute top-[15%] left-[15%]">
                <img src="/Vector.png" alt="pink-images">
            </div>

            <div id="shape-yellow" class="shape z-8">
                <img src="/yellow.png" alt="yellow">
            </div>

            <div id="shape-teal" class="shape absolute top-[22%] left-[19%] w-[55%] z-10">
                <img src="/stgreen.png" alt="teal-shape">
            </div>

            <div id="shape-red" class="shape absolute top-[70%] left-[10%] z-8">
                <img src="/sfa.png" alt="red-image">
            </div>

            <div id="shape-blue" class="shape absolute top-[15%] left-[45%] w-[37%] z-10">
                <img src="/Blue.png" alt="blue-image-icon">
            </div>

            <div id="secgreen" class="shape absolute top-[50%] right-0">
                <img src="/secgreen.png" alt="secondary-green"> 
            </div>
        </div>
    </div>
</div>

    <script>
        const pink = document.getElementById('pink');
        const yellow = document.getElementById('shape-yellow');
        const teal = document.getElementById('shape-teal');
        const red = document.getElementById('shape-red');
        const blue = document.getElementById('shape-blue');

        window.addEventListener('scroll', () => {
            const maxScroll = window.innerHeight * 1.5;
            const scrollPercent = Math.min(window.scrollY / maxScroll, 1);
            const baseProgress = Math.min(scrollPercent * 2, 1);

            let horizontalScale = 1;
            if (scrollPercent > 0.5) {
                const scaleProgress = (scrollPercent - 0.5) / 0.5;
                horizontalScale = 1 + (scaleProgress * 0.55); 
            }

            const isTablet = window.innerWidth >= 768 && window.innerWidth <= 1024;
            const isMobile = window.innerWidth < 768;

            let scalar = 1.0;
            if (isTablet) {
                scalar = 0.45;
            } else if (isMobile) {
                scalar = 0.3;
            }

            pink.style.transform = `translate(${baseProgress * 40 * scalar}px, ${baseProgress * 180 * scalar}px)`;
            yellow.style.transform = `translate(${baseProgress * 50 * scalar}px, ${baseProgress * 250 * scalar}px)`;
            teal.style.transform = `translate(${baseProgress * -80 * scalar}px, ${baseProgress * 412 * scalar}px) scaleX(${horizontalScale})`;
            red.style.transform = `translate(${baseProgress * -30 * scalar}px, ${baseProgress * 250 * scalar}px) scaleX(${horizontalScale})`;
            blue.style.transform = `translate(${baseProgress * -70 * scalar}px, ${baseProgress * 250 * scalar}px) scaleX(${horizontalScale})`;
        });
    </script>
     <script type="module" src="/src/main.js"></script>
</body>
</html>
